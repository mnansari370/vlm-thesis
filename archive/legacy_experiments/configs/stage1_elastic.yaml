# Stage 1 — elastic backbone (LoRA + projector, random-K CLS pruning).
# Produces the dense ceiling + the static frontier + the pilot measurement from ONE model.
experiment_name: stage1_elastic
seed: 42

data:
  json_path: data/llava_mix/llava_v1_5_mix665k.json
  image_root: data/llava_mix/images
  turn_mode: first            # one clean (question, answer) per record
  max_samples: 300000         # source-stratified subsample for the pilot; null = full mix
  verify_images: true         # skip rows whose image is missing (expect a few from OCR-VQA)
  drop_missing: true
  num_workers: 8

model:
  model_name: llava-hf/llava-1.5-7b-hf
  dtype: bfloat16
  image_pad: true             # expand2square (LLaVA-1.5 default)
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  k_ladder: [32, 64, 128, 256, 576]
  gradient_checkpointing: true   # ~3x lower activation memory (bs=16 fits in ~24GB)

training:
  epochs: 1
  batch_size: 16             # fits comfortably with gradient checkpointing (peak ~24GB @ K=576)
  grad_accum: 2              # effective batch 32
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  log_every: 50               # steps
  save_every: 2000            # steps
  # PRECISION NOTE: this stage trains in pure bf16 (matches the tested wrapper).
  # If the FULL run's loss plateaus, switch to fp32 master weights for the
  # trainable params + autocast(bf16) forward (a tested upgrade, not enabled here).
